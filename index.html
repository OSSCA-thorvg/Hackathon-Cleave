<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>Cleave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #6a452f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #stage {
      position: relative;
      container-type: size;
      width: min(95vw, 140vh);
      aspect-ratio: 3 / 2;
      background: url('./kitchen.png') center / 100% 100% no-repeat;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    #board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scale(1.20);
    }

    #canvas {
      position: absolute;
      left: 21%;
      top: 19%;
      width: 66% !important;
      height: 57% !important;
    }

    /* ---- 재료 장식 ---- */
    #leaves {
      position: absolute;
      left: 53.9%;
      top: 9%;
      width: 22%;
      transform: translateX(-50%);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    #leaves.gone {
      opacity: 0;
      transform: translateX(-50%) translateY(-30px);
    }

    #calyx {
      position: absolute;
      left: 53.9%;
      top: 32%;
      width: 16%;
      transform: translateX(-50%);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
      display: none;
    }

    #calyx.gone {
      opacity: 0;
      transform: translateX(-50%) scale(1.4);
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-family: 'Fredoka', 'Jua', system-ui, sans-serif;
      color: #5c3a1e;
    }

    /* ---- 공통 패널 ---- */
    .panel {
      background: #fff4dc;
      border: 0.5cqw solid #5c3a1e;
      border-radius: 1.4cqw;
      box-shadow: 0 0.5cqw 0 #c9a173;
    }

    /* ---- 재료 이름 ---- */
    #stage-name {
      position: absolute;
      left: 50%;
      top: 3%;
      transform: translateX(-50%);
      font-size: 2.4cqw;
      font-weight: 700;
      padding: 0.6cqw 2cqw;
      background: #fff4dc;
      border: 0.4cqw solid #5c3a1e;
      border-radius: 1cqw;
    }

    /* ---- 조각 수 ---- */
    #counter {
      position: absolute;
      left: 2.5%;
      top: 3%;
      padding: 1cqw 2cqw 0.8cqw;
      text-align: center;
      min-width: 13cqw;
    }

    #count {
      font-size: 5.2cqw;
      font-weight: 700;
      line-height: 1;
    }

    #count-label {
      font-size: 1.2cqw;
      font-weight: 700;
      letter-spacing: 0.25cqw;
      opacity: 0.6;
      margin-top: 0.3cqw;
    }

    #goal {
      margin-top: 0.5cqw;
      padding-top: 0.5cqw;
      border-top: 0.15cqw solid #e0cfae;
      font-size: 1.3cqw;
      font-weight: 700;
      color: #c98c33;
    }

    /* ---- 타이머 ---- */
    #timer-wrap {
      position: absolute;
      right: 2.5%;
      top: 3%;
      padding: 1cqw 1.8cqw;
      text-align: center;
      min-width: 11cqw;
    }

    #timer {
      font-size: 4cqw;
      font-weight: 700;
      line-height: 1;
    }

    #timer-bar {
      margin-top: 0.7cqw;
      height: 0.9cqw;
      background: #e0cfae;
      border-radius: 1cqw;
      overflow: hidden;
    }

    #timer-fill {
      height: 100%;
      width: 100%;
      background: #6cba7a;
      border-radius: 1cqw;
      transition: background 0.3s;
    }

    #timer-wrap.low #timer {
      color: #d94f3d;
    }

    #timer-wrap.low #timer-fill {
      background: #d94f3d;
    }

    /* ---- 칼 선택 ---- */
    #knives {
      position: absolute;
      left: 2.5%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1cqw;
    }

    .knife {
      pointer-events: auto;
      width: 8cqw;
      height: 8cqw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4cqw;
      cursor: pointer;
      opacity: 0.5;
      transform: scale(0.86);
      transition: opacity 0.15s, transform 0.15s;
      font-family: inherit;
    }

    .knife svg {
      width: 4.4cqw;
      height: 4.4cqw;
    }

    .knife span {
      font-size: 1.3cqw;
      font-weight: 700;
      color: #5c3a1e;
    }

    .knife.active {
      opacity: 1;
      transform: scale(1);
      background: #ffe0a8;
    }

    /* ---- 오버레이 공통 ---- */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(40, 22, 10, 0.5);
      pointer-events: auto;
    }

    .overlay.gone {
      display: none;
    }

    /* ---- 시작 화면 ---- */
    #intro-card {
      padding: 3cqw 5cqw;
      text-align: center;
      max-width: 52cqw;
    }

    #title {
      font-size: 6cqw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.2cqw;
    }

    #subtitle {
      font-size: 1.5cqw;
      font-weight: 500;
      opacity: 0.65;
      margin-top: 0.6cqw;
    }

    #rules {
      margin: 2.4cqw 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.9cqw 1.6cqw;
      text-align: left;
      font-size: 1.6cqw;
      font-weight: 500;
    }

    #rules b {
      font-weight: 700;
      background: #ffe0a8;
      border: 0.25cqw solid #5c3a1e;
      border-radius: 0.6cqw;
      padding: 0.15cqw 0.8cqw;
      white-space: nowrap;
    }

    /* ---- 버튼 ---- */
    .btn {
      font-family: inherit;
      font-weight: 700;
      color: #5c3a1e;
      border: 0.4cqw solid #5c3a1e;
      border-radius: 1.2cqw;
      background: #ffc861;
      box-shadow: 0 0.5cqw 0 #c98c33;
      cursor: pointer;
    }

    .btn:active {
      transform: translateY(0.3cqw);
      box-shadow: 0 0.2cqw 0 #c98c33;
    }

    #start {
      margin-top: 2.6cqw;
      font-size: 2.2cqw;
      padding: 1.1cqw 4cqw;
    }

    #again {
      margin-top: 2.2cqw;
      font-size: 1.9cqw;
      padding: 1cqw 3.4cqw;
    }

    #to-select {
      display: block;
      margin: 1cqw auto 0;
      font-size: 1.5cqw;
      padding: 0.7cqw 2.4cqw;
      background: #ffe9c2;
      border-width: 0.35cqw;
      border-radius: 1cqw;
      box-shadow: none;
    }

    #to-select:active {
      transform: translateY(0.2cqw);
      box-shadow: none;
    }

    /* ---- 결과 ---- */
    #result-card {
      padding: 3cqw 6cqw;
      text-align: center;
    }

    #stars {
      font-size: 6cqw;
      letter-spacing: 1cqw;
      color: #f0a93c;
      line-height: 1.1;
    }

    #final {
      font-size: 5cqw;
      font-weight: 700;
      line-height: 1;
      margin-top: 1cqw;
    }

    #final-label {
      font-size: 1.3cqw;
      font-weight: 700;
      letter-spacing: 0.25cqw;
      opacity: 0.6;
    }

    #final-goal {
      margin-top: 0.8cqw;
      font-size: 1.3cqw;
      font-weight: 700;
      color: #c98c33;
    }

    /* ---- 재료 선택 ---- */
    #select {
      background: rgba(40, 22, 10, 0.55);
      z-index: 5;
    }

    #select-card {
      padding: 3cqw 4cqw;
      text-align: center;
    }

    #select-title {
      font-size: 3.4cqw;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 2.2cqw;
    }

    #stage-list {
      display: flex;
      gap: 1.4cqw;
    }

    .stage-card {
      width: 12cqw;
      height: 15.5cqw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5cqw;
      font-family: inherit;
      background: #ffe9c2;
      border: 0.4cqw solid #5c3a1e;
      border-radius: 1.2cqw;
      box-shadow: 0 0.5cqw 0 #c9a173;
      cursor: pointer;
    }

    .stage-card:active {
      transform: translateY(0.3cqw);
      box-shadow: 0 0.2cqw 0 #c9a173;
    }

    .stage-card .emoji {
      font-size: 4cqw;
      line-height: 1;
    }

    .stage-card .label {
      font-size: 1.6cqw;
      font-weight: 700;
      color: #5c3a1e;
    }

    .stage-card .time {
      font-size: 1.2cqw;
      opacity: 0.6;
      color: #5c3a1e;
    }

    .stage-card .goal {
      font-size: 1.05cqw;
      font-weight: 700;
      color: #c98c33;
      letter-spacing: 0.05cqw;
    }

    .stage-card.locked {
      background: #ddd0bb;
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
    }

    .stage-card.locked .label {
      font-size: 1.3cqw;
    }

    /* ---- 카운트다운 ---- */
    #countdown {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 6;
    }

    #countdown.show {
      display: flex;
    }

    #count-text {
      font-family: inherit;
      font-size: 14cqw;
      font-weight: 700;
      color: #fff4dc;
      text-shadow: 0 0 1.4cqw rgba(60, 30, 10, 0.85);
    }

    #count-text.beat {
      animation: pop 0.75s ease-out;
    }

    @keyframes pop {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }

      30% {
        transform: scale(1.15);
        opacity: 1;
      }

      70% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div id="stage">
    <img id="board" src="./board.png" />
    <canvas id="canvas"></canvas>
    <img id="leaves" src="./leaves.svg" />
    <img id="calyx" src="./calyx.svg" />

    <div id="hud">
      <div id="stage-name">당근</div>

      <div id="counter" class="panel">
        <div id="count">1</div>
        <div id="count-label">PIECES</div>
        <div id="goal">★ 100</div>
      </div>

      <div id="timer-wrap" class="panel">
        <div id="timer">30</div>
        <div id="timer-bar">
          <div id="timer-fill"></div>
        </div>
      </div>

      <div id="knives">
        <button class="knife panel active" data-set="0">
          <svg viewBox="0 0 40 40" fill="none" stroke="#5c3a1e" stroke-width="4" stroke-linecap="round">
            <line x1="8" y1="32" x2="32" y2="8" />
          </svg>
          <span>1</span>
        </button>
        <button class="knife panel" data-set="1">
          <svg viewBox="0 0 40 40" fill="none" stroke="#5c3a1e" stroke-width="4" stroke-linecap="round">
            <line x1="4" y1="26" x2="22" y2="8" />
            <line x1="18" y1="34" x2="36" y2="16" />
          </svg>
          <span>2</span>
        </button>
        <button class="knife panel" data-set="2">
          <svg viewBox="0 0 40 40" fill="none" stroke="#5c3a1e" stroke-width="4" stroke-linecap="round">
            <line x1="3" y1="22" x2="17" y2="8" />
            <line x1="12" y1="30" x2="26" y2="16" />
            <line x1="21" y1="38" x2="35" y2="24" />
          </svg>
          <span>3</span>
        </button>
      </div>

      <div id="intro" class="overlay">
        <div id="intro-card" class="panel">
          <div id="title">Cleave</div>
          <div id="subtitle">제한 시간 안에 재료를 최대한 잘게</div>

          <div id="rules">
            <b>좌클릭</b><span>칼날에 걸린 조각을 자릅니다</span>
            <b>좌클릭 드래그</b><span>흩어진 조각을 칼로 모읍니다</span>
            <b>우클릭</b><span>칼이 돌아갑니다</span>
            <b>1 2 3</b><span>칼을 바꿉니다</span>
          </div>

          <button id="start" class="btn">시작하기</button>
        </div>
      </div>

      <div id="result" class="overlay gone">
        <div id="result-card" class="panel">
          <div id="stars">☆☆☆</div>
          <div id="final">0</div>
          <div id="final-label">PIECES</div>
          <div id="final-goal"></div>
          <button id="again" class="btn">다시하기</button>
          <button id="to-select" class="btn">재료 고르기</button>
        </div>
      </div>

      <div id="select" class="overlay gone">
        <div id="select-card" class="panel">
          <div id="select-title">재료 고르기</div>
          <div id="stage-list">
            <button class="stage-card" data-stage="0">
              <span class="emoji">🥕</span>
              <span class="label">당근</span>
              <span class="time">30초</span>
              <span class="goal">★100 ★200 ★300</span>
            </button>
            <button class="stage-card" data-stage="1">
              <span class="emoji">🍅</span>
              <span class="label">토마토</span>
              <span class="time">25초</span>
              <span class="goal">★200 ★500 ★800</span>
            </button>
            <button class="stage-card" data-stage="2">
              <span class="emoji">🌿</span>
              <span class="label">파</span>
              <span class="time">20초</span>
              <span class="goal">★200 ★350 ★500</span>
            </button>
            <div class="stage-card locked">
              <span class="emoji">🔒</span>
              <span class="label">COMING<br>SOON</span>
            </div>
            <div class="stage-card locked">
              <span class="emoji">🔒</span>
              <span class="label">COMING<br>SOON</span>
            </div>
          </div>
        </div>
      </div>

      <div id="countdown">
        <div id="count-text">3</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
